<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">Wasted room capacity: Greedy versus DP optimizer</title>
<desc id="desc">The greedy baseline wastes 1,708 seats, while the dynamic-programming optimizer wastes 158 seats.</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="380" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324D">Room-capacity waste comparison</text>
<text x="380" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#52616B">Lower is better · wasted seats across the full schedule</text>
<line x1="115" y1="340.0" x2="675" y2="340.0" stroke="#D9E1E7" stroke-width="1"/>
<text x="101" y="345.0" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#52616B">0</text>
<line x1="115" y1="281.2" x2="675" y2="281.2" stroke="#D9E1E7" stroke-width="1"/>
<text x="101" y="286.2" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#52616B">500</text>
<line x1="115" y1="222.5" x2="675" y2="222.5" stroke="#D9E1E7" stroke-width="1"/>
<text x="101" y="227.5" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#52616B">1,000</text>
<line x1="115" y1="163.8" x2="675" y2="163.8" stroke="#D9E1E7" stroke-width="1"/>
<text x="101" y="168.8" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#52616B">1,500</text>
<line x1="115" y1="105.0" x2="675" y2="105.0" stroke="#D9E1E7" stroke-width="1"/>
<text x="101" y="110.0" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#52616B">2,000</text>
<line x1="115" y1="105" x2="115" y2="340" stroke="#52616B" stroke-width="1.5"/>
<line x1="115" y1="340" x2="675" y2="340" stroke="#52616B" stroke-width="1.5"/>
<rect x="210" y="139.3" width="150" height="200.7" rx="5" fill="#E76F51"/>
<text x="285.0" y="127.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324D">1,708</text>
<text x="285.0" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#17324D">Greedy</text>
<rect x="445" y="321.4" width="150" height="18.6" rx="5" fill="#2A9D8F"/>
<text x="520.0" y="309.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324D">158</text>
<text x="520.0" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#17324D">DP optimizer</text>
<rect x="175" y="383" width="410" height="45" rx="8" fill="#E5F4F1"/>
<text x="380" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#16756A">1,550 fewer wasted seats (90.7% reduction)</text>
</svg>